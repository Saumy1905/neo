<!-- Header Google Ads Component - High Visibility -->
<div class="header-ad-container" id="header-google-ads">
  <div class="header-ad-wrapper">
    <div class="ad-label-header">
      <span>Sponsored</span>
    </div>
    
    <!-- Header Banner Ad Unit -->
    <div class="header-ad-unit">
      <!-- Replace with your actual Google AdSense code -->
      <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXX"
           crossorigin="anonymous"></script>
      <!-- Header Banner Ad -->
      <ins class="adsbygoogle header-ad-ins"
           style="display:block"
           data-ad-client="ca-pub-XXXXXXXXXX"
           data-ad-slot="XXXXXXXXXX"
           data-ad-format="horizontal"
           data-full-width-responsive="true"></ins>
      <script>
           (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>
    
    <!-- Header Ad Fallback -->
    <div class="header-ad-fallback" style="display: none;">
      <div class="header-ad-placeholder">
        <div class="placeholder-content">
          <i class="fas fa-graduation-cap"></i>
          <span>Support Free Education Resources</span>
          <small>Ad-free experience coming soon!</small>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Close button for mobile -->
  <button class="header-ad-close" onclick="closeHeaderAd()" aria-label="Close ad">
    <i class="fas fa-times"></i>
  </button>
</div>

<style>
.header-ad-container {
  background: linear-gradient(135deg, rgba(74, 108, 247, 0.05) 0%, rgba(255, 255, 255, 0.95) 100%);
  border-bottom: 1px solid rgba(74, 108, 247, 0.1);
  padding: 0.8rem 0;
  position: relative;
  z-index: 99;
  transition: all 0.3s ease;
}

.header-ad-wrapper {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
  text-align: center;
  position: relative;
}

.ad-label-header {
  font-size: 0.7rem;
  color: var(--secondary-color);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 0.3rem;
  opacity: 0.6;
}

.header-ad-unit {
  max-height: 90px;
  overflow: hidden;
  border-radius: 6px;
  position: relative;
}

.header-ad-ins {
  max-height: 90px;
  width: 100%;
}

.header-ad-placeholder {
  padding: 1rem 2rem;
  background: linear-gradient(135deg, rgba(74, 108, 247, 0.1) 0%, rgba(255, 255, 255, 0.9) 100%);
  border-radius: 6px;
  border: 1px dashed rgba(74, 108, 247, 0.3);
  margin: 0 auto;
  max-width: 600px;
}

.placeholder-content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.placeholder-content i {
  font-size: 1.2rem;
  color: var(--primary-color);
  animation: bounce 2s ease-in-out infinite;
}

.placeholder-content span {
  font-weight: 600;
  color: var(--text-color);
  font-size: 0.9rem;
}

.placeholder-content small {
  font-size: 0.75rem;
  color: var(--secondary-color);
  opacity: 0.8;
}

.header-ad-close {
  position: absolute;
  top: 50%;
  right: 10px;
  transform: translateY(-50%);
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid rgba(0, 0, 0, 0.1);
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 0.7rem;
  color: var(--secondary-color);
}

.header-ad-close:hover {
  background: rgba(255, 255, 255, 1);
  color: var(--primary-color);
  transform: translateY(-50%) scale(1.1);
}

@keyframes bounce {
  0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-5px); }
  60% { transform: translateY(-3px); }
}

/* Dark theme support */
.dark-theme .header-ad-container {
  background: linear-gradient(135deg, rgba(93, 123, 249, 0.1) 0%, rgba(30, 30, 30, 0.95) 100%);
  border-bottom-color: rgba(93, 123, 249, 0.2);
}

.dark-theme .header-ad-placeholder {
  background: linear-gradient(135deg, rgba(93, 123, 249, 0.15) 0%, rgba(45, 45, 45, 0.9) 100%);
  border-color: rgba(93, 123, 249, 0.4);
}

.dark-theme .header-ad-close {
  background: rgba(45, 45, 45, 0.9);
  border-color: rgba(255, 255, 255, 0.1);
  color: var(--text-color);
}

/* Mobile responsive */
@media (max-width: 768px) {
  .header-ad-container {
    padding: 0.6rem 0;
  }
  
  .header-ad-wrapper {
    padding: 0 15px;
  }
  
  .header-ad-unit {
    max-height: 70px;
  }
  
  .header-ad-ins {
    max-height: 70px;
  }
  
  .header-ad-close {
    display: flex;
    right: 5px;
  }
  
  .header-ad-placeholder {
    padding: 0.8rem 1rem;
  }
  
  .placeholder-content {
    flex-direction: column;
    gap: 0.5rem;
  }
  
  .placeholder-content span {
    font-size: 0.8rem;
  }
  
  .placeholder-content small {
    font-size: 0.7rem;
  }
}

@media (max-width: 480px) {
  .header-ad-container {
    padding: 0.5rem 0;
  }
  
  .header-ad-unit {
    max-height: 60px;
  }
  
  .header-ad-ins {
    max-height: 60px;
  }
  
  .placeholder-content i {
    font-size: 1rem;
  }
  
  .placeholder-content span {
    font-size: 0.75rem;
  }
}

/* Hidden state */
.header-ad-container.hidden {
  display: none;
}

/* Animation for showing ads */
.header-ad-container {
  animation: slideDown 0.5s ease-out;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideUp {
  from {
    opacity: 1;
    transform: translateY(0);
  }
  to {
    opacity: 0;
    transform: translateY(-20px);
  }
}
</style>

<script>
function closeHeaderAd() {
  const headerAd = document.getElementById('header-google-ads');
  if (headerAd) {
    headerAd.style.animation = 'slideUp 0.3s ease-out';
    setTimeout(() => {
      headerAd.classList.add('hidden');
      // Store user preference
      localStorage.setItem('headerAdClosed', 'true');
    }, 300);
  }
}

// Check if user previously closed the header ad
document.addEventListener('DOMContentLoaded', function() {
  const headerAdClosed = localStorage.getItem('headerAdClosed');
  if (headerAdClosed === 'true') {
    const headerAd = document.getElementById('header-google-ads');
    if (headerAd) {
      headerAd.classList.add('hidden');
    }
  }
  
  // Ad loading detection for header
  setTimeout(function() {
    const headerContainer = document.getElementById('header-google-ads');
    if (headerContainer) {
      const adIns = headerContainer.querySelector('.adsbygoogle');
      if (adIns && adIns.innerHTML === '') {
        const fallback = headerContainer.querySelector('.header-ad-fallback');
        const adUnit = headerContainer.querySelector('.header-ad-unit');
        if (fallback && adUnit) {
          fallback.style.display = 'block';
          adUnit.style.display = 'none';
        }
      }
    }
  }, 2000);
});
</script>
